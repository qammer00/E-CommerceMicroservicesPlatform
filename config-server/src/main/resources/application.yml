spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Relative to the config-server working directory (repo root is one level up)
          search-locations: file:../config-repo

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
