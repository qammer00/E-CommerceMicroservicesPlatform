spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    # Standalone registry: do not register this server as a Eureka client
    register-with-eureka: false
    # Standalone registry: do not fetch registry from peer Eureka servers
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
