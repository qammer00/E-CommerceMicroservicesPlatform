spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    openfeign:
      circuitbreaker:
        enabled: false
  datasource:
    url: jdbc:h2:mem:ecommerce_orders;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaDiscoveryClientConfiguration

server:
  port: 0

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  kafka:
    enabled: false
  jwt:
    secret: test-jwt-secret-key-at-least-32-characters-long
    expiration-ms: 3600000

resilience4j:
  circuitbreaker:
    instances:
      productService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        ignoreExceptions:
          - com.ecommerce.orderservice.exception.ProductNotFoundException
          - com.ecommerce.orderservice.exception.InsufficientStockException
          - com.ecommerce.orderservice.exception.InactiveProductException
  retry:
    instances:
      productService:
        maxAttempts: 1

management:
  endpoints:
    web:
      exposure:
        include: health
