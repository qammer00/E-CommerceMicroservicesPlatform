# payment-service configuration (no secrets — use environment variables)
server:
  port: 8084

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        retries: 3
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ecommerce_payments?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
      client:
        config:
          order-service:
            connectTimeout: 2000
            readTimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  kafka:
    enabled: true
    outbox:
      poll-interval-ms: 2000
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  payment:
    currency: PKR
    provider: mock

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        ignoreExceptions:
          - com.ecommerce.paymentservice.exception.PaymentOrderNotFoundException
          - com.ecommerce.paymentservice.exception.PaymentOrderMismatchException
          - com.ecommerce.paymentservice.exception.InvalidOrderForPaymentException
  timelimiter:
    instances:
      orderService:
        timeoutDuration: 3s
  retry:
    instances:
      orderService:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.RetryableException
          - com.ecommerce.paymentservice.exception.PaymentOrderUnavailableException
        ignoreExceptions:
          - com.ecommerce.paymentservice.exception.PaymentOrderNotFoundException
          - com.ecommerce.paymentservice.exception.PaymentOrderMismatchException
          - com.ecommerce.paymentservice.exception.InvalidOrderForPaymentException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
